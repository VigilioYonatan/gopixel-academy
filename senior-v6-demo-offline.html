<!doctype html><html lang="es" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GoPixel Academy · Senior Go Native Labs</title><style>
:root{font-family:ui-sans-serif,system-ui,"Segoe UI",sans-serif;color-scheme:dark;--bg:#081422;--panel:#102538;--edge:#28546b;--ink:#e9f7ff;--sub:#9db9ca;--aqua:#1ac8e8;--gold:#ffd36e}

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);min-height:100vh;background-image:radial-gradient(circle at 80% 0%,#00add81e,transparent 44%)}a{color:inherit;text-decoration:none}button,select,input{font:inherit}button,select,input{border:1px solid var(--edge);background:var(--panel);color:var(--ink);border-radius:10px;padding:10px 12px}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--aqua);outline-offset:3px}

main{max-width:1200px;margin:auto;padding:38px 20px 100px}.hero{background:linear-gradient(120deg,var(--panel),var(--bg));border:1px solid var(--edge);border-radius:22px;padding:36px;display:grid;grid-template-columns:1fr minmax(120px,250px);gap:20px;align-items:center;box-shadow:0 20px 60px #0002}.eyebrow{color:var(--gold);font:700 12px monospace;letter-spacing:2px}.hero h1{font-weight:900;font-size:clamp(32px,5vw,64px);line-height:1.05;margin:14px 0}.hero p{max-width:690px;color:var(--sub);font-size:17px;line-height:1.5}.hero img{image-rendering:pixelated;width:100%;max-width:245px;filter:drop-shadow(0 12px 12px #0003)}.primary{display:inline-flex;padding:14px 21px;color:#041d29;background:#21d4ec;font-weight:800;border-radius:10px;border:2px solid #66f3ff;box-shadow:4px 4px 0 #006d8a;margin-top:12px}.notice{margin:24px 0 18px;color:var(--sub);border-left:4px solid var(--gold);padding:10px 14px;background:var(--panel);border-radius:6px}.toolbar{margin:28px 0 18px;display:flex;justify-content:space-between;align-items:center;gap:16px}.toolbar input{min-width:220px;flex:1;max-width:380px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.card{border:1px solid var(--edge);border-radius:16px;padding:20px;background:var(--panel);box-shadow:0 10px 20px #00000010;min-height:180px}.card .id{font:700 12px monospace;color:var(--gold)}.card h3{margin:12px 0 8px}.card p{color:var(--sub);font-size:13px;line-height:1.55}.card code{overflow-wrap:anywhere;color:var(--aqua);font-size:12px}.card .tag{display:inline-block;padding:3px 9px;border-radius:7px;border:1px solid var(--edge);font-size:12px}pre{padding:16px;background:#07121c;color:#b2fcdd;border-radius:12px;overflow:auto;line-height:1.65}.commands{margin-top:30px}.commands h2{font-size:19px}footer{padding:25px;text-align:center;color:var(--sub);font-size:13px;border-top:1px solid var(--edge)}@media(max-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{grid-template-columns:1fr}.hero img{max-width:155px;grid-row:1}.toolbar{flex-direction:column;align-items:stretch}.toolbar input{max-width:unset;width:100%}}@media(max-width:500px){.grid{grid-template-columns:1fr}nav .actions{margin-left:0}.hero{padding:22px}}

</style></head><body><nav><strong>🐹 Go<span>Pixel</span> Academy</strong><div class="actions"><select id="lang" aria-label="Language"><option value="es">🇪🇸 ES</option><option value="en">🇺🇸 EN</option><option value="ja">🇯🇵 JA</option><option value="zh">🇨🇳 ZH</option><option value="pt">🇧🇷 PT</option><option value="fr">🇫🇷 FR</option></select><button id="theme">☼ / ☾</button></div></nav><main><section class="hero"><div><span class="eyebrow">👑 SENIOR MODE · GO NATIVE</span><h1 id="title"></h1><p id="subtitle"></p><a id="download" class="primary" href="public/downloads/go-native-senior-labs.zip" download></a></div><img alt="Gopher pixelado con corona" src="public/assets/gophers/senior.png"></section><div id="notice" class="notice"></div><div class="toolbar"><h2>18 MODULES · S01 — S18</h2><input id="search" placeholder="Search / Buscar" aria-label="Search lab"></div><section class="grid" id="grid"></section><section class="commands"><h2>LOCAL · GO TOOLCHAIN</h2><pre>cd labs-native
go test ./...
go test -race ./...
go test -run '^$' -bench . ./s08-performance</pre></section></main><footer>GoPixel Academy · Static frontend · Go Gopher inspired by original artwork by Renee French</footer><script type="application/json" id="data">[{"id": "S01", "slug": "s01-idiomatic-errors", "title": "Parseo sin falsos éxitos", "directory": "labs-native/s01-idiomatic-errors", "command": "go test ./labs-native/s01-idiomatic-errors"}, {"id": "S02", "slug": "s02-injection", "title": "Inversión de dependencias", "directory": "labs-native/s02-injection", "command": "go test ./labs-native/s02-injection"}, {"id": "S03", "slug": "s03-idempotency", "title": "Idempotencia de operaciones", "directory": "labs-native/s03-idempotency", "command": "go test ./labs-native/s03-idempotency"}, {"id": "S04", "slug": "s04-domain-state", "title": "Invariantes de dominio", "directory": "labs-native/s04-domain-state", "command": "go test ./labs-native/s04-domain-state"}, {"id": "S05", "slug": "s05-worker-pool", "title": "Concurrencia acotada y cancelable", "directory": "labs-native/s05-worker-pool", "command": "go test ./labs-native/s05-worker-pool"}, {"id": "S06", "slug": "s06-atomic", "title": "Contadores atómicos", "directory": "labs-native/s06-atomic", "command": "go test ./labs-native/s06-atomic"}, {"id": "S07", "slug": "s07-slice-retention", "title": "Evitar retención de memoria", "directory": "labs-native/s07-slice-retention", "command": "go test ./labs-native/s07-slice-retention"}, {"id": "S08", "slug": "s08-performance", "title": "Concatenación eficiente", "directory": "labs-native/s08-performance", "command": "go test ./labs-native/s08-performance"}, {"id": "S09", "slug": "s09-dedup-events", "title": "Deduplicación de entregas", "directory": "labs-native/s09-dedup-events", "command": "go test ./labs-native/s09-dedup-events"}, {"id": "S10", "slug": "s10-inventory", "title": "Reservas de stock sin sobreventa", "directory": "labs-native/s10-inventory", "command": "go test ./labs-native/s10-inventory"}, {"id": "S11", "slug": "s11-backoff", "title": "Reintentos con límite", "directory": "labs-native/s11-backoff", "command": "go test ./labs-native/s11-backoff"}, {"id": "S12", "slug": "s12-traversal", "title": "Validación de rutas de archivos", "directory": "labs-native/s12-traversal", "command": "go test ./labs-native/s12-traversal"}, {"id": "S13", "slug": "s13-clock-testing", "title": "Tiempo determinista", "directory": "labs-native/s13-clock-testing", "command": "go test ./labs-native/s13-clock-testing"}, {"id": "S14", "slug": "s14-percentiles", "title": "Percentiles de latencia", "directory": "labs-native/s14-percentiles", "command": "go test ./labs-native/s14-percentiles"}, {"id": "S15", "slug": "s15-shutdown", "title": "Apagado con contexto", "directory": "labs-native/s15-shutdown", "command": "go test ./labs-native/s15-shutdown"}, {"id": "S16", "slug": "s16-compatibility", "title": "Migración de esquemas", "directory": "labs-native/s16-compatibility", "command": "go test ./labs-native/s16-compatibility"}, {"id": "S17", "slug": "s17-review-priority", "title": "Priorización técnica", "directory": "labs-native/s17-review-priority", "command": "go test ./labs-native/s17-review-priority"}, {"id": "S18", "slug": "s18-capacity", "title": "Capacity planning", "directory": "labs-native/s18-capacity", "command": "go test ./labs-native/s18-capacity"}]</script><script>
const langs={"es": ["Laboratorios Senior de Go", "18 laboratorios nativos, pruebas reales y diseño pixel moderno.", "Descargar código y tests", "Requiere Go local. No ejecuta Go en esta página.", "Claro / Oscuro", "Buscar módulo", "Volver a la demo v5"], "en": ["Senior Go labs", "18 native labs, real tests and modern pixel art.", "Download code and tests", "Requires Go installed locally; this page does not run Go.", "Light / Dark", "Search module", "Open v5 demo"], "ja": ["Go シニアラボ", "18 の Go ネイティブラボ、実際のテスト、モダンなピクセルデザイン。", "コードとテストをダウンロード", "Go をローカルにインストールしてください。ブラウザでは実行されません。", "テーマ切替", "モジュール検索", "v5 デモへ"], "zh": ["Go 高级实验室", "18 个原生 Go 实验室、真实测试和现代像素风格。", "下载代码和测试", "需要本地安装 Go。本页面不运行 Go。", "切换主题", "搜索模块", "打开 v5 演示"], "pt": ["Laboratórios Go Sênior", "18 laboratórios nativos, testes reais e pixel art moderno.", "Baixar código e testes", "Requer Go instalado localmente. Esta página não executa Go.", "Claro / Escuro", "Buscar módulo", "Abrir demo v5"], "fr": ["Laboratoires Go Senior", "18 laboratoires natifs, des tests réels et un pixel art moderne.", "Télécharger code et tests", "Nécessite Go installé localement. Cette page ne l’exécute pas.", "Clair / Sombre", "Rechercher", "Ouvrir la démo v5"]};const labs=JSON.parse(document.getElementById('data').textContent);const doc=document.documentElement;const search=document.getElementById('search');const select=document.getElementById('lang');let locale='es';function render(){const t=langs[locale];document.getElementById('title').textContent=t[0];document.getElementById('subtitle').textContent=t[1];document.getElementById('download').textContent='↓ '+t[2];document.getElementById('notice').textContent=t[3];search.placeholder=t[5];const query=search.value.toLowerCase();const grid=document.getElementById('grid');grid.replaceChildren();for(const lab of labs){if(!(`${lab.id} ${lab.title} ${lab.slug}`.toLowerCase().includes(query)))continue;const card=document.createElement('article');card.className='card';const id=document.createElement('span');id.className='id';id.textContent=lab.id;const title=document.createElement('h3');title.textContent=lab.title;const path=document.createElement('code');path.textContent=lab.directory;const p=document.createElement('p');p.append(path);const tag=document.createElement('span');tag.className='tag';tag.textContent='Go · unit tests';card.append(id,title,p,tag);grid.append(card)}}select.onchange=()=>{locale=select.value;doc.lang=locale;render()};document.getElementById('theme').onclick=()=>{doc.dataset.theme=doc.dataset.theme==='dark'?'light':'dark'};search.oninput=render;render();
</script></body></html>
