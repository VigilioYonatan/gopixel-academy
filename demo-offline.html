const LANGS=[['es','🇪🇸 Español'],['en','🇬🇧 English'],['ja','🇯🇵 日本語'],['zh','🇨🇳 中文'],['pt','🇧🇷 Português'],['fr','🇫🇷 Français']];
const BASIC=['basic','intermediate','advanced','senior'];
const TRACKICONS={basic:'book',intermediate:'layers',advanced:'rocket',senior:'crown',frameworks:'framework'};
const defaults={locale:'es',theme:'dark',seniorEnabled:false,reducedMotion:false,completed:[],gameWins:[],xp:0,notes:{},drafts:{}};
let P=defaults, game='quiz',selected='',testState='',hint=false,criteria=[],order=['fmt.Println("Hola")','func main() {','package main','import "fmt"','}'];
try { P={...defaults,...JSON.parse(localStorage.getItem('gopixel:v1')||'{}')}; }catch{}
const $=document.getElementById('app');
const t=k=>(T[P.locale]||T.es)[k]||k;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=(key,size=20)=>`<img class="pixel-icon" width="${size}" height="${size}" alt="" src="data:image/svg+xml;base64,${IS[key]||IS.code}"/>`;
const gopher=(name='welcome',cls='')=>`<img class="gopher ${cls}" alt="" src="data:image/png;base64,${GS[name]||GS.welcome}"/>`;
const nav=path=>{location.hash='#/'+path;scrollTo({top:0,behavior:'auto'})};
const button=(label,act,kind='primary')=>`<button class="btn btn-${kind}" data-action="${act}">${label}</button>`;
const eyebrow=(txt)=>`<span class="eyebrow small">${txt}</span>`;
const head=(eyeb,ttl,desc='')=>`<div class="page-heading">${eyebrow(eyeb)}<h1>${esc(ttl)}</h1><p>${esc(desc)}</p></div>`;
const store=()=>{try{localStorage.setItem('gopixel:v1',JSON.stringify(P))}catch{}};
const complete=id=>{if(!P.completed.includes(id)){P.completed.push(id);P.xp+=20;store()}};
function layout(body){let route=(location.hash.slice(2).split('/')[0]||'home');
 const links=[['home','','home'],['learn','learn','book'],['games','games','quiz'],['frameworks','frameworks','framework'],['senior','senior','crown']];
 return `<div class="app-shell"><header class="site-header"><a href="#/" class="brand">${gopher('welcome')}<span>Go<span class="brand-cyan">Pixel</span><small>ACADEMY</small></span></a><nav class="primary-nav">${links.map(([key,url,ic])=>`<a href="#/${url}" class="${route===key?'active':''}">${icon(ic,17)}<span>${esc(t(key))}</span></a>`).join('')}</nav><div class="header-actions"><label class="lang-wrap"><select data-change="locale" aria-label="${esc(t('language'))}">${LANGS.map(([id,label])=>`<option value="${id}" ${id===P.locale?'selected':''}>${label}</option>`).join('')}</select></label><button data-action="theme" class="circle-action" aria-label="${esc(t('theme'))}">${icon(P.theme==='dark'?'sun':'moon',20)}</button><button data-action="senior" class="senior-toggle ${P.seniorEnabled?'on':''}" aria-pressed="${P.seniorEnabled}">${icon('crown',18)}<span>${esc(t('senior'))}</span><i class="toggle-knob"></i></button><a href="#/settings" class="circle-action">${icon('settings',18)}</a></div></header><main class="main-content">${body}</main><footer class="site-footer"><div class="footer-inner"><span>© GoPixel Academy · <a href="https://go.dev/brand" target="_blank" rel="noreferrer">Gopher © Renee French · CC BY 4.0</a></span><span>${esc(t('notOfficial'))}</span><div class="footer-links"><a href="#/progress">${esc(t('progress'))}</a><a href="#/settings">${esc(t('settings'))}</a></div></div></footer></div>`;
}
function home(){return `<div class="hero"><div class="hero-stars">✦ · ✧ · ✦</div><div class="hero-copy"><div class="eyebrow"><span class="dot"></span>${esc(t('heroEyebrow'))}</div><h1>Go<span>Pixel</span><br/>Academy</h1><p class="hero-title">${esc(t('heroTitle'))}</p><p class="hero-subtitle">${esc(t('heroSubtitle'))}</p><div class="hero-ctas">${button(icon('play',20)+t('start'),'start')}${button(t('explore')+' →','learn','outline')}</div><div class="hero-metrics"><span><b>54</b> Go</span><span><b>18</b> Senior</span><span><b>8</b> Frameworks</span><span><b>6</b> 🌐</span></div></div><div class="hero-art"><div class="hero-orbit"></div>${gopher('coding','hero-gopher')}<div class="code-float"><span>● ● ● &nbsp; main.go</span><code>func main() {<br/> &nbsp;fmt.Println("Go!")<br/>}</code></div></div></div><section class="section"><div class="section-heading"><div>${eyebrow('LEARNING MAP')}<h2>${esc(t('featured'))}</h2></div><a href="#/learn" class="text-link">${esc(t('showAll'))} →</a></div><div class="track-grid">${BASIC.map(x=>`<a class="track-card ${x==='senior'?'gold':x==='basic'?'green':x==='advanced'?'orange':'blue'}" href="#/${x==='senior'?'senior':'learn/'+x}"><div class="track-top"><span class="track-icon">${icon(TRACKICONS[x],30)}</span><span class="track-count">${x==='senior'?18:12} MODULES</span></div><h3>${esc(t(x))}</h3><p>${esc((M.find(m=>m.track===x)||{}).summary?.[P.locale]||'')}</p><div class="track-bottom"><div class="progress-bar"><i style="width:${x==='basic'?Math.floor(100*P.completed.length/54):0}%"></i></div><span>↗</span></div></a>`).join('')}</div></section><section class="feature-banner"><div>${eyebrow('SENIOR MODE')}<h2>Think beyond syntax.</h2><p>${esc(t('briefHint'))}</p>${button(icon('crown',18)+t('senior'),'openSenior','senior')}</div>${gopher('senior')}</section>`}
function catalog(track='basic'){if(!BASIC.includes(track))track='basic';let list=M.filter(x=>x.track===track);return `<div class="content-page">${head('GO LEARNING',t('featured'),'54 modules · 4 tracks')}<div class="catalog-layout"><aside class="catalog-aside"><div class="aside-label">${esc(t('learn'))}</div>${BASIC.map(k=>`<a href="#/learn/${k}" class="aside-link ${track===k?'selected':''}">${icon(TRACKICONS[k])}${esc(t(k))}<b>${k==='senior'?18:12}</b></a>`).join('')}<div class="aside-gopher">${gopher('reading')}<span>One step at a time.</span></div></aside><div class="catalog-main"><div class="catalog-head"><h2>${esc(t(track))}</h2><p>${esc(list[0]?.summary[P.locale]||'')}</p></div><div class="module-grid">${list.map(m=>`<a href="#/${track==='senior'?'senior':'lesson'}/${m.id}" class="module-card"><div class="module-card-top"><span class="mono id">${m.id}</span><span class="status ${P.completed.includes(m.id)?'done':''}">${P.completed.includes(m.id)?'✓ '+esc(t('completed')):esc(t(m.status==='implemented'?'preview':'planned'))}</span></div><h3>${esc(m.title[P.locale])}</h3><p>${esc(m.summary[P.locale])}</p><span class="module-arrow">↗</span></a>`).join('')}</div></div></div></div>`}
const examples={B01:['package main\n\nimport "fmt"\n\nfunc main() {\n  fmt.Println("_____")\n}','fmt.Println("Hola, Go!")','Hola, Go!'], B02:['package main\nfunc main(){\n // edad := ...\n}','edad := 25','edad := 25'],B03:['package main\nfunc main(){\n // Declara nombre\n}','var nombre string','var nombre string'],B04:['package main\nfunc main(){\n // for ...\n}','for i := 0; i < 3; i++','for i := 0; i < 3; i++'],B05:['package main\n// función sumar\n','func sumar(a int, b int) int','func sumar(a int, b int) int']};
function lesson(id){let m=M.find(x=>x.id===id&&x.track!=='senior');if(!m)return catalog();let spec=examples[id];let code=P.drafts[id]??spec?.[0]??'';return `<div class="content-page lesson-page"><div class="breadcrumbs"><a href="#/learn">${esc(t('learn'))}</a><span>/</span>${esc(t(m.track))}<span>/</span>${m.id}</div>${head(t('lesson')+' · '+id,m.title[P.locale],m.summary[P.locale])}<div class="lesson-layout"><div class="lesson-main"><section class="card lesson-intro"><div class="lesson-intro-art">${gopher(spec?'reading':'architecture')}</div><h2>${esc(t('objectives'))}</h2><p>${esc(m.summary[P.locale])}</p>${spec?'':`<p class="notice">${esc(t('contentPlan'))}</p>`}</section><section class="card editor-card"><div class="panel-title"><span>${icon('terminal')}main.go</span><span class="tag info">${esc(t(spec?'preview':'planned'))}</span></div>${spec?`<textarea data-input="draft" data-id="${id}" class="code-editor" spellcheck="false">${esc(code)}</textarea><div class="editor-actions">${button(icon('check',17)+t('validate'),'validateLesson')}${button(t('reset'),'resetLesson','outline')}${button(t('hint'),'hintLesson','quiet')}</div>${hint?`<div class="hint-box"><code>${esc(spec[1])}</code></div>`:''}${testState?`<div class="feedback ${testState}">${esc(t(testState))}</div>`:''}<p class="small-disclaimer">${esc(t('runUnavailable'))}</p>`:`<div class="empty-editor">${icon('book',35)}${esc(t('contentPlan'))}</div>`}</section></div><aside class="lesson-side"><section class="card side-panel"><h3>${esc(t('practice'))}</h3><ul class="clean-list"><li>01 · ${esc(t('lesson'))}</li><li>02 · ${esc(t('complete'))}</li><li>03 · ${esc(t('validate'))}</li></ul></section><section class="card side-gopher">${gopher(P.seniorEnabled?'senior':'idea')}<p>${esc(t('savedAutomatic'))}</p></section></aside></div></div>`}
function games(){let modes=[['quiz','question'],['complete','code'],['order','puzzle'],['predict','terminal'],['bug','bug']];let questions={es:'¿Qué palabra inicia una goroutine?',en:'Which keyword starts a goroutine?',ja:'goroutineを開始するキーワードは？',zh:'哪个关键字启动 goroutine？',pt:'Qual palavra inicia uma goroutine?',fr:'Quel mot-clé lance une goroutine ?'};
let modeContent=game==='quiz'?`<h2>${esc(questions[P.locale])}</h2><div class="option-grid">${['go','spawn','async','thread'].map(x=>`<button class="choice ${selected===x?'chosen':''}" data-pick="${x}">${x}</button>`).join('')}</div>`:game==='complete'?`<h2>${esc(t('complete'))}</h2><pre class="mini-code">package main\nimport "fmt"\nfunc main() {\n  fmt.____("Hola")\n}</pre><input data-input="fill" value="${esc(selected)}" placeholder="Println"/>`:game==='predict'?`<h2>${esc(t('predict'))}</h2><pre class="mini-code">x := 2\nx *= 3\nfmt.Println(x)</pre><div class="option-grid">${['4','5','6','8'].map(x=>`<button class="choice ${selected===x?'chosen':''}" data-pick="${x}">${x}</button>`).join('')}</div>`:game==='bug'?`<h2>${esc(t('bug'))}</h2><pre class="mini-code">fmt.Println("Hola"</pre><div class="option-grid">${[['parenthesis',')'],['semicolon',';'],['quote','"'],['bracket','}']].map(([v,l])=>`<button class="choice ${selected===v?'chosen':''}" data-pick="${v}">${esc(l)}</button>`).join('')}</div>`:`<h2>${esc(t('order'))}</h2><div class="order-list">${order.map((c,i)=>`<div class="order-item"><code>${esc(c)}</code><div><button ${i===0?'disabled':''} data-move="${i}:up">↑</button><button ${i===order.length-1?'disabled':''} data-move="${i}:down">↓</button></div></div>`).join('')}</div>`;
return `<div class="content-page">${head('PLAY & LEARN',t('games'),t('gameDesc'))}<div class="games-grid">${modes.map(([id,ic])=>`<button class="game-tile ${game===id?'chosen':''}" data-game="${id}"><span>${icon(ic,28)}</span><b>${esc(t(id))}</b><small>${P.gameWins.includes(id)?'✓':'5 MIN'}</small></button>`).join('')}</div><section class="card game-arena"><div class="game-arena-head">${eyebrow('GO PIXEL MINI LAB')}<b>${esc(t(game))}</b></div>${modeContent}<div class="game-actions">${button(t('validate'),'validateGame')}${button(t('reset'),'resetGame','outline')}</div>${testState?`<div class="feedback ${testState}">${esc(t(testState))}</div>`:''}</section></div>`}
function senior(id){let seniors=M.filter(m=>m.track==='senior'),m=seniors.find(m=>m.id===id);if(!m)return `<div class="content-page"><div class="senior-hero"><div>${eyebrow('✦ SENIOR ENGINEERING LAB')}<h1>${esc(t('senior'))}</h1><p>${esc(t('briefHint'))}</p><div class="senior-stats"><span>18 LABS</span><span>6 CRITERIA</span><span>LOCAL NOTES</span></div></div>${gopher('senior')}</div><section class="section"><div class="section-heading"><div>${eyebrow('PRODUCTION SCENARIOS')}<h2>${esc(t('challenge'))}</h2></div></div><div class="senior-grid">${seniors.map(x=>`<a class="senior-card" href="#/senior/${x.id}"><div class="senior-card-top">${icon('crown',20)}<span>${x.id}</span><span class="senior-kind">${esc(x.challenge?.kind)}</span></div><h3>${esc(x.title[P.locale])}</h3><p>${esc(x.challenge.scenario[P.locale])}</p><span class="text-link">${esc(t('viewModule'))} ↗</span></a>`).join('')}</div></section></div>`;
let criteriaKeys=['correctness','reliability','security','performance','maintainability','reasoning'];return `<div class="content-page"><div class="breadcrumbs"><a href="#/senior">${esc(t('senior'))}</a><span>/</span><b>${m.id}</b></div>${head('SENIOR LAB · '+m.id,m.title[P.locale],m.challenge.kind.toUpperCase())}<div class="senior-lab-grid"><div class="senior-lab-main"><section class="card brief-card"><div class="panel-title"><span>${icon('crown')}${esc(t('productionBrief'))}</span><span class="tag gold">${m.id}</span></div><p class="brief-lead">${esc(m.challenge.scenario[P.locale])}</p><p class="muted">${esc(t('briefHint'))}</p></section><section class="card notes-card"><div class="panel-title"><span>${icon('architecture')}${esc(t('notes'))}</span><span class="tag info">ADR DRAFT</span></div><textarea data-input="notes" data-id="${m.id}" class="notes-editor" placeholder="${esc(t('notesPlaceholder'))}">${esc(P.notes[m.id]||'')}</textarea><p class="small-disclaimer">${esc(t('savedAutomatic'))}</p></section><section class="card rubric-card"><h3>${esc(t('selfReview'))}</h3><p class="muted">${esc(t('briefHint'))}</p><div class="criteria-grid">${criteriaKeys.map(k=>`<label class="check-criterion"><input data-criterion="${k}" type="checkbox" ${criteria.includes(k)?'checked':''}/>${esc(t(k))}</label>`).join('')}</div><div class="rubric-actions"><span>${criteria.length}/6 · ${esc(t('checklist'))}</span>${button(t('review'),'finishSenior','senior')}</div><p class="small-disclaimer">${esc(t('notCertified'))}</p></section></div><aside class="senior-aside"><section class="card"><div class="side-senior-title">${gopher('architecture')}<h3>${esc(t('requirements'))}</h3></div><ul class="rubric-list">${criteriaKeys.map(k=>`<li>${icon('check',15)}${esc(t(k))}</li>`).join('')}</ul></section></aside></div></div>`}
function frameworks(id){let items=M.filter(m=>m.track==='frameworks'),m=items.find(m=>m.id===id);if(m)return `<div class="content-page"><div class="breadcrumbs"><a href="#/frameworks">${esc(t('frameworks'))}</a> / ${m.id}</div>${head('FRAMEWORKS ACADEMY · '+m.id,m.title[P.locale],m.summary[P.locale])}<div class="framework-detail"><section class="card"><h2>${esc(t('objectives'))}</h2><div class="chip-line">${m.tools.map(s=>`<span class="chip">${esc(s)}</span>`).join('')}</div><p class="notice">${esc(t('frameworkHint'))}</p><h3>${esc(t('contentPlan'))}</h3></section><section class="card">${gopher('building')}<h3>${esc(t('challenge'))}</h3><p>${esc(t('contentPlan'))}</p>${button(t('back'),'openFrameworks','outline')}</section></div></div>`;return `<div class="content-page">${head('BACKEND SPECIALIZATION',t('frameworks'),t('frameworkHint'))}<div class="framework-grid">${items.map(m=>`<a class="framework-card" href="#/frameworks/${m.id}"><div class="framework-icon">${icon('framework',29)}</div><div><small class="mono">${m.id}</small><h3>${esc(m.title[P.locale])}</h3><p>${m.tools.map(esc).join(' · ')}</p></div><span>↗</span></a>`).join('')}</div></div>`}
function progress(){return `<div class="content-page">${head('YOUR JOURNEY',t('progress'),t('savedAutomatic'))}<div class="progress-layout"><section class="card progress-summary">${gopher('graduate')}<div>${eyebrow('GO PIXEL EXPLORER')}<h2>${P.xp} XP</h2><p>${P.completed.length} ${esc(t('completed'))} · ${P.gameWins.length} ${esc(t('games'))}</p></div></section><section class="card"><h3>${esc(t('achievements'))}</h3><div class="achievement-list"><span>${icon('trophy',25)} ${esc(t('firstSteps'))}</span><span>${icon('bug',25)} BUG HUNTER</span></div></section></div><h2>${esc(t('completed'))}</h2><div class="module-grid">${M.filter(m=>P.completed.includes(m.id)).map(m=>`<div class="module-card"><span class="mono">${m.id}</span><h3>${esc(m.title[P.locale])}</h3></div>`).join('')}</div></div>`}
function settings(){return `<div class="content-page">${head('PERSONALIZE',t('settings'),t('savedAutomatic'))}<div class="settings-grid"><section class="card"><h2>${esc(t('theme'))}</h2><div class="choice-row">${button(icon('sun',18)+t('light'),'setLight',P.theme==='light'?'primary':'outline')}${button(icon('moon',18)+t('dark'),'setDark',P.theme==='dark'?'primary':'outline')}</div><h3>${esc(t('reducedMotion'))}</h3><label class="setting-control"><input type="checkbox" data-criterion="motion" ${P.reducedMotion?'checked':''}/>${esc(t('reducedMotion'))}</label></section><section class="card"><h2>${esc(t('privacy'))}</h2><p>${esc(t('noServer'))}</p><p>${esc(t('savedAutomatic'))}</p><div class="settings-actions">${button(t('export'),'export','outline')}<label class="file-import">${esc(t('import'))}<input type="file" accept=".json" data-file="import"/></label>${button(t('clear'),'clear','outline')}</div></section></div></div>`}
function render(){let parts=(location.hash||'#/').replace(/^#\/?/,'').split('/').filter(Boolean);let [page,id]=parts;let content=page==='learn'?catalog(id):page==='lesson'?lesson(id||'B01'):page==='games'?games():page==='senior'?senior(id):page==='frameworks'?frameworks(id):page==='progress'?progress():page==='settings'?settings():home();document.documentElement.lang=P.locale;document.documentElement.setAttribute('data-theme',P.theme);document.documentElement.setAttribute('data-senior',P.seniorEnabled);document.documentElement.setAttribute('data-reduced-motion',P.reducedMotion);$.innerHTML=layout(content)}
window.addEventListener('hashchange',()=>{criteria=[];testState='';hint=false;render()});
document.addEventListener('click',e=>{let el=e.target.closest('[data-action],[data-game],[data-pick],[data-move]');if(!el)return;
if(el.dataset.game){game=el.dataset.game;selected='';testState='';return render()}
if(el.dataset.pick){selected=el.dataset.pick;testState='';return render()}
if(el.dataset.move){let [idx,dir]=el.dataset.move.split(':'),i=Number(idx),j=dir==='up'?i-1:i+1;if(j>=0&&j<order.length){[order[i],order[j]]=[order[j],order[i]];render()}return}
let a=el.dataset.action;if(a==='theme')P.theme=P.theme==='dark'?'light':'dark';if(a==='senior')P.seniorEnabled=!P.seniorEnabled;
if(a==='start')return nav('lesson/B01');if(a==='learn')return nav('learn');if(a==='openSenior')return nav('senior');if(a==='openFrameworks')return nav('frameworks');
if(a==='setLight')P.theme='light';if(a==='setDark')P.theme='dark';
if(a==='hintLesson')hint=!hint;
if(a==='resetLesson'){let id=location.hash.split('/').pop();P.drafts[id]=examples[id][0];testState=''}
if(a==='validateLesson'){let id=location.hash.split('/').pop(),v=P.drafts[id]||examples[id]?.[0]||'',expected=examples[id]?.[1]||'',pass=v.includes(expected);testState=pass?'correct':'incorrect';if(pass)complete(id)}
if(a==='validateGame'){let good=game==='quiz'?selected==='go':game==='complete'?selected.trim()==='Println':game==='predict'?selected==='6':game==='bug'?selected==='parenthesis':order.join('|')==='package main|import "fmt"|func main() {|fmt.Println("Hola")|}';testState=good?'correct':'incorrect';if(good&&!P.gameWins.includes(game)){P.gameWins.push(game);P.xp+=15}}
if(a==='resetGame'){selected='';testState='';order=['fmt.Println("Hola")','func main() {','package main','import "fmt"','}']}
if(a==='finishSenior'){let id=location.hash.split('/').pop();if(criteria.length===6&&(P.notes[id]||'').length>=60)complete(id);else alert(t('briefHint'))}
if(a==='clear'){if(confirm(t('confirmClear')))P={...defaults,notes:{},drafts:{},completed:[],gameWins:[]}}
if(a==='export'){let blob=new Blob([JSON.stringify({version:1,prefs:P},null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),link=document.createElement('a');link.href=u;link.download='gopixel-progress.json';link.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
store();render()});
document.addEventListener('change',e=>{let el=e.target;if(el.dataset.change==='locale'){P.locale=el.value;store();render()}
if(el.dataset.criterion){if(el.dataset.criterion==='motion'){P.reducedMotion=el.checked;store();render()}else{criteria=el.checked?[...criteria,el.dataset.criterion]:criteria.filter(v=>v!==el.dataset.criterion);render()}}
if(el.dataset.file==='import'){let f=el.files?.[0];if(!f)return;f.text().then(txt=>{try{let parsed=JSON.parse(txt);if(parsed.version!==1||!Array.isArray(parsed.prefs?.completed))throw Error('bad');P={...defaults,...parsed.prefs};if(!T[P.locale])P.locale='es';store();render()}catch{alert('Invalid backup')}})}});
document.addEventListener('input',e=>{let el=e.target;if(el.dataset.input==='draft'){P.drafts[el.dataset.id]=el.value;store()}if(el.dataset.input==='notes'){P.notes[el.dataset.id]=el.value;store()}if(el.dataset.input==='fill'){selected=el.value}});
render();
</script></body></html>
